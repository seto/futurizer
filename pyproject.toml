[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "futurizer"
version = "0.0.6"
description = "Kinetic syntax shredder with Markovian noise injection and infinitive-driven deconstruction."
readme = "README.md"
authors = [{ name="seto" }]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Source = "https://github.com/seto/futurizer"

[project.scripts]
futurize = "futurizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313", "py314", "py315"]
extend-exclude = "/lang/"

[tool.isort]
profile = "black"
line_length = 88
extend_skip = ["src/futurizer/lang/"]

[tool.mypy]
python_version = "3.11"
strict = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["src/futurizer/lang/"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "B",    # flake8-bugbear 
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify 
    "FURB", # refurb
]
ignore = ["E501"]  # Ignore line length errors, as Black handles formatting
