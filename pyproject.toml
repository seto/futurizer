[build-system]
requires = ["setuptools>=82.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "futurizer"
version = "0.0.4"
description = "Experimental machinery for mechanical transmutation."
readme = "README.md"
authors = [{ name="Roberto Matarazzo" }]
license = { text="AGPL-3.0-or-later" }
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
]

[project.urls]
"Source" = "https://github.com/seto/futurizer"

[project.scripts]
futurize = "futurizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py312", "py313", "py314"]

[tool.isort]
profile = "black"
line_length = 88
